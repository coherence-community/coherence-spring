coherence:
  sessions:
    server:
      - name: default
        config: "coherence-cache-config.xml"
        priority: 1
        scope-name: fooscope
      - name: test
        config: "test-coherence-config.xml"
        priority: 2
        scope-name: barscope
      - config: "test-coherence-config.xml"
        scope-name: myscope
  properties:
    coherence.log.limit: 0
    coherence.log.level: 5
    coherence.log.logger: CoherenceSpring
    coherence.log: jdk
    coherence.log.format: "foobar {date}/{uptime} <{level}> (thread={thread}, member={member}): {text}"
  property-prefix: "coherence.properties."

