name: CI - Pull Request
on:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 17, 21 ]
    runs-on: macos-latest
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        name: 📥 Checkout repository
        with:
          fetch-depth: 0
      - name: 🔧 Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5.0.0
        with:
          distribution: 'oracle'
          java-version: ${{ matrix.java-version }}
      - name: 🫙 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven2-
      - name: 🛠 Build and test with ☕ Java ${{ matrix.java-version }}
        shell: bash
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"

          diagnostics="$RUNNER_TEMP/startup-diagnostics"
          mkdir -p "$diagnostics"
          python3 -B .github/scripts/capture_test_threads.py "$diagnostics" &
          collector_pid=$!
          trap 'kill "$collector_pid" 2>/dev/null || true' EXIT

          set +e
          ./mvnw clean install -B -Pjdk17 2>&1 | tee "$diagnostics/maven.log"
          build_status=${PIPESTATUS[0]}
          set -e

          touch "$diagnostics/stop"
          wait "$collector_pid" || true
          exit "$build_status"
        env:
          GIT_COMMIT: ${{github.event.workflow_run.head_commit.id}}
          HEAD_BRANCH: ${{github.event.workflow_run.head_branch}}
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-jdk${{ matrix.java-version }}-attempt${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/startup-diagnostics/
            **/target/surefire-reports/
      - name: 📊 Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Java CI / Test Report (${{ matrix.java-version }})
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_retries: 'true'
      - name: 🧹 Clean Maven cache
        run: |
          find ~/.m2/repository -type d -name '*SNAPSHOT' -prune -exec rm -rf '{}' +
