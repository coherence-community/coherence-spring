# This workflow will build a Java project with Maven and deploy SNAPSHOT artifacts
# to Maven Central.
#
# Only successful "CI Coherence Spring" push runs in the canonical repository
# on main, 4.x, or 3.x are eligible.
# The deployed artifacts are built from the exact commit that passed CI.
#
name: Deploy to Maven Central

on:
  workflow_run:
    workflows: [CI Coherence Spring]
    branches:
      - main
      - 4.x
      - 3.x
    types:
    - completed
jobs:
  build:
    if: >-
      ${{ github.repository == 'coherence-community/coherence-spring' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      if: ${{ github.event.workflow_run.head_branch != '3.x' }}
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
    - uses: actions/checkout@v5.0.0
      if: ${{ github.event.workflow_run.head_branch == '3.x' }}
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
    - name: Set up JDK ${{ github.event.workflow_run.head_branch == '3.x' && '11' || '17' }}
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'adopt'
        java-version: ${{ github.event.workflow_run.head_branch == '3.x' && '11' || '17' }}
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-${{ github.event.workflow_run.head_branch == '3.x' && 'maven2' || 'm2' }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.event.workflow_run.head_branch == '3.x' && 'maven2' || 'm2' }}-
    - name: Check, Build and Deploy SNAPSHOTs
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        MAVEN_GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        MAVEN_SONATYPE_USERNAME: "${{secrets.MAVEN_SONATYPE_USERNAME}}"
        MAVEN_SONATYPE_TOKEN: "${{secrets.MAVEN_SONATYPE_TOKEN}}"
        NVD_API_KEY: "${{ github.event.workflow_run.head_branch == '3.x' && secrets.NVD_API_KEY || '' }}"
      run: |
        maven_profiles=()
        if [[ "$HEAD_BRANCH" == '3.x' ]]; then
          maven_profiles=(-Pspring)
        fi
        version=$(./mvnw help:evaluate --no-transfer-progress -B "${maven_profiles[@]}" --settings .mvn/settings.xml -N -q -Dexpression=project.version -DforceStdout)
        if [[ -z "$version" || "$version" == *[[:space:]]* || "$version" == *"\${"* ]]; then
          echo "::error::Unable to read a valid root project version."
          exit 1
        fi
        if [[ "$version" != *-SNAPSHOT ]]; then
          echo "Publication skipped: project version $version is not a SNAPSHOT."
          exit 0
        fi
        # Check every reactor module before any deploy-phase publication.
        ./mvnw enforcer:enforce --no-transfer-progress -B "${maven_profiles[@]}" --settings .mvn/settings.xml -Denforcer.rules=requireSnapshotVersion -Denforcer.ignoreCache=true -Denforcer.skip=false -Denforcer.fail=true
        git config --global user.email "github-action@users.noreply.github.com"
        git config --global user.name "GitHub Action"
        if [[ "$HEAD_BRANCH" == '3.x' ]]; then
          ./mvnw deploy -B -Pspring --settings .mvn/settings.xml
        else
          ./mvnw clean install --no-transfer-progress -B --settings .mvn/settings.xml -DskipTests=true
          ./mvnw deploy --no-transfer-progress -B --settings .mvn/settings.xml
        fi
    - name: Clean Maven cache
      run: |
        find ~/.m2/repository -type d -name '*SNAPSHOT' | xargs rm -fr
